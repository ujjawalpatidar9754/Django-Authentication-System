<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Auth App</title>

    <!-- 1. Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- 2. NAVBAR SECTION -->
    <nav class="navbar navbar-expand-lg navbar-white bg-white border-bottom shadow-sm py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/accounts/profile/">Auth Project</a>
            
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <span class="me-2 text-secondary">Hi, <strong>{{ user.username }}</strong>!</span>
                    <a href="{% url 'profile' %}" class="btn btn-outline-primary btn-sm">Profile</a>
                    
                    <!-- Secure POST Logout Form -->
                    <form action="{% url 'logout' %}" method="POST" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-sm btn-primary">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-sm btn-outline-primary">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- 3. MAIN CONTENT CONTAINER -->
    <div class="container" style="max-width: 600px;">
        
        <!-- Flash Messages Display (Toast/Alerts) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Dynamic Content Injected Here -->
        {% block content %}
        {% endblock %}

    </div>

    <!-- 4. Bootstrap JS (Alerts Dismiss karne ke liye ZARURI hai) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
