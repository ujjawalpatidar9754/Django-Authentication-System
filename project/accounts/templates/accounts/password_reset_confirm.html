{% extends 'accounts/base.html' %}

{% block content %}
<div class="card p-4 shadow-sm">
    <h3 class="text-center mb-3">Set New Password</h3>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-2">Change Password</button>
    </form>
</div>
{% endblock %}
